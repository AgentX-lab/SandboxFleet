# Fork e2e pool: 2 Workers.
# primary (3 slots): parent + first Fork(2) children — same Worker.
# secondary (2 slots): nested Fork grandchild — forced cross-Worker by capacity.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: "{{RUNTIME_HANDLER}}"
      snapshotter: "{{SNAPSHOTTER}}"
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 2Gi
  workerTemplates:
    - name: primary
      replicas: 1
      slots:
        - profile: small
          count: 3
    - name: secondary
      replicas: 1
      slots:
        - profile: small
          count: 2
