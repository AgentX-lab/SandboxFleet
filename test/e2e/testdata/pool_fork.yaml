# Fork e2e pool: 2 Workers, 3 slots total.
# primary (2): parent + first Fork(1) child.
# secondary (1): nested Fork grandchild (cross-Worker by capacity).
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: "{{RUNTIME_HANDLER}}"
      snapshotter: "{{SNAPSHOTTER}}"
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 2Gi
  workerTemplates:
    - name: primary
      replicas: 1
      slots:
        - profile: small
          count: 2
    - name: secondary
      replicas: 1
      slots:
        - profile: small
          count: 1
