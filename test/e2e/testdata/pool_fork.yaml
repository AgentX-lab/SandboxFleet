# Fork e2e pool: 1 Worker, 4 small Slots (parent + 2 children + 1 nested) + MinIO snapshotStorage.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: "{{RUNTIME_HANDLER}}"
      snapshotter: "{{SNAPSHOTTER}}"
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
  workerTemplates:
    - name: default
      replicas: 1
      slots:
        - profile: small
          count: 4
