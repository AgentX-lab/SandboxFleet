# Snapshot/restore e2e: 1 Worker, 2 slots (parent + restored child).
# Includes MinIO-backed snapshotStorage; no cross-Worker requirement.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: "{{RUNTIME_HANDLER}}"
      snapshotter: "{{SNAPSHOTTER}}"
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 500m
          memory: 2Gi
  workerTemplates:
    - name: default
      replicas: 1
      slots:
        - profile: small
          count: 2
