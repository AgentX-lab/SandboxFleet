# Basic pool: 1 Worker, 2 small Slots.
# Used by lifecycle and Slot scale success/failure-with-headroom cases.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: "{{RUNTIME_HANDLER}}"
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
  workerTemplates:
    - name: default
      replicas: 1
      slots:
        - profile: small
          count: 2
