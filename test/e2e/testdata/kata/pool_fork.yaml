# Kata variant of pool_fork.yaml (requires /dev/kvm on the node).
# primary 2 slots / secondary 1 slot: nested Fork grandchild cross-Worker by capacity.
# Worker Pod memory = sum(slots) + max(slot) + 2Gi (host overhead for CRI/kata).
# Keep slot memory small so two Workers still fit one kind node.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  workerTemplates:
    - name: primary
      replicas: 1
      slots:
        - profile: small
          count: 2
    - name: secondary
      replicas: 1
      slots:
        - profile: small
          count: 1
