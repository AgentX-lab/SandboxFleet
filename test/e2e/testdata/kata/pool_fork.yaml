# Kata variant of pool_fork.yaml (requires /dev/kvm on the node).
# primary 2 slots / secondary 1 slot: nested Fork grandchild cross-Worker by capacity.
# Keep slot memory low: Worker Pod = sum(slots); 2 Workers + Kata VMs must fit one kind node.
# previous 2Gi/3Gi per slot → primary alone requested 4Gi and starved secondary containerd.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 1536Mi
  workerTemplates:
    - name: primary
      replicas: 1
      slots:
        - profile: small
          count: 2
    - name: secondary
      replicas: 1
      slots:
        - profile: small
          count: 1
