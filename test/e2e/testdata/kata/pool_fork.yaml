# Kata variant of pool_fork.yaml (requires /dev/kvm on the node).
# Slot memory is intentionally high: parent CH VM + OnDemand restore peak
# well above the gVisor fixture; 4×4Gi limit → Worker limit 16Gi to avoid OOMKilled.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
  workerTemplates:
    - name: default
      replicas: 1
      slots:
        - profile: small
          count: 4
