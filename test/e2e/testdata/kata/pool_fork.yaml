# Kata variant of pool_fork.yaml (requires /dev/kvm on the node).
# primary 3 slots / secondary 2 slots: first fork same Worker, nested fork cross-Worker.
# Per-slot memory high for CH + OnDemand restore peaks.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
  workerTemplates:
    - name: primary
      replicas: 1
      slots:
        - profile: small
          count: 3
    - name: secondary
      replicas: 1
      slots:
        - profile: small
          count: 2
