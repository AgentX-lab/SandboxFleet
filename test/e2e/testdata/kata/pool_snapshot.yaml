# Kata variant of pool_snapshot.yaml (1 Worker, 1 slot).
# Parent is deleted after snapshot before restore so only one VM runs at a time.
#
# Slot memory sizes the nested kata guest (via CRI MemoryLimitInBytes). Keep it
# small. Worker Pod memory is Sum(slots) + max(slot) + 2Gi host overhead so
# restore page-cache does not force a giant guest.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  snapshotStorage:
    s3:
      endpoint: http://minio:9000
      bucket: sandboxfleet-snapshots
      region: us-east-1
      credentialsSecretRef:
        name: minio-credentials
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
  workerTemplates:
    - name: default
      replicas: 1
      slots:
        - profile: small
          count: 1
