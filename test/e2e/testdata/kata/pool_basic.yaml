# Kata variant of pool_basic.yaml (requires /dev/kvm on the node).
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
  workerTemplates:
    - name: default
      replicas: 1
      slots:
        - profile: small
          count: 2
