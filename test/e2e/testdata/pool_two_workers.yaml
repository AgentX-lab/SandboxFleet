# Two-Worker pool: each Worker has one Slot.
# Used by Worker scale-down success/blocked.
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: "{{NAME}}"
  namespace: "{{NAMESPACE}}"
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: "{{RUNTIME_HANDLER}}"
      snapshotter: "{{SNAPSHOTTER}}"
  slotProfiles:
    - name: small
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
  workerTemplates:
    - name: default
      replicas: 2
      slots:
        - profile: small
          count: 1
