apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxes.sandboxfleet.io
spec:
  group: sandboxfleet.io
  scope: Namespaced
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
    shortNames:
      - sf
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Worker
          type: string
          jsonPath: .status.assignment.worker
        - name: Slot
          type: integer
          jsonPath: .status.assignment.slotID
        - name: Profile
          type: string
          jsonPath: .status.assignment.slotProfile
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - poolRef
                - slotProfile
                - container
              properties:
                poolRef:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: poolRef is immutable
                slotProfile:
                  type: string
                  minLength: 1
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: slotProfile is immutable
                container:
                  type: object
                  required:
                    - image
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: container is immutable
                  properties:
                    image:
                      type: string
                      minLength: 1
                    command:
                      type: array
                      items:
                        type: string
                    args:
                      type: array
                      items:
                        type: string
                    env:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                assignment:
                  type: object
                  properties:
                    worker:
                      type: string
                    slotID:
                      type: integer
                      format: int32
                    slotProfile:
                      type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
