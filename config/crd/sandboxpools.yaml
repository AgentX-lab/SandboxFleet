apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxpools.sandboxfleet.io
spec:
  group: sandboxfleet.io
  scope: Namespaced
  names:
    kind: SandboxPool
    listKind: SandboxPoolList
    plural: sandboxpools
    singular: sandboxpool
    shortNames:
      - sfp
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Workers
          type: integer
          jsonPath: .status.currentWorkers
        - name: Ready
          type: integer
          jsonPath: .status.readyWorkers
        - name: Available
          type: integer
          jsonPath: .status.availableSlots
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - runtime
                - slotProfiles
                - workerTemplates
              x-kubernetes-validations:
                - rule: "self.runtime == oldSelf.runtime"
                  message: runtime is immutable
                - rule: "oldSelf.slotProfiles.all(o, self.slotProfiles.exists(p, p.name == o.name && p.resources == o.resources))"
                  message: slotProfile names and resources are immutable
                - rule: "oldSelf.workerTemplates.all(o, self.workerTemplates.exists(t, t.name == o.name))"
                  message: workerTemplate names are immutable
              properties:
                runtime:
                  type: object
                  required:
                    - backend
                  properties:
                    backend:
                      type: string
                      enum:
                        - cri
                    cri:
                      type: object
                      required:
                        - runtimeHandler
                      properties:
                        runtimeHandler:
                          type: string
                          minLength: 1
                  x-kubernetes-validations:
                    - rule: "self.backend != 'cri' || has(self.cri)"
                      message: cri configuration is required for the cri backend
                slotProfiles:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - resources
                    properties:
                      name:
                        type: string
                        minLength: 1
                      resources:
                        type: object
                        properties:
                          requests:
                            type: object
                            additionalProperties:
                              anyOf:
                                - type: integer
                                - type: string
                              x-kubernetes-int-or-string: true
                          limits:
                            type: object
                            additionalProperties:
                              anyOf:
                                - type: integer
                                - type: string
                              x-kubernetes-int-or-string: true
                workerTemplates:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - replicas
                      - slots
                    properties:
                      name:
                        type: string
                        minLength: 1
                      replicas:
                        type: integer
                        format: int32
                        minimum: 0
                      slots:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                            - profile
                            - count
                          properties:
                            profile:
                              type: string
                              minLength: 1
                            count:
                              type: integer
                              format: int32
                              minimum: 1
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                currentWorkers:
                  type: integer
                  format: int32
                readyWorkers:
                  type: integer
                  format: int32
                usedSlots:
                  type: integer
                  format: int32
                availableSlots:
                  type: integer
                  format: int32
                templates:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      replicas:
                        type: integer
                        format: int32
                      readyReplicas:
                        type: integer
                        format: int32
                      appliedSlots:
                        type: array
                        items:
                          type: object
                          required:
                            - id
                            - profile
                          properties:
                            id:
                              type: integer
                              format: int32
                            profile:
                              type: string
                              minLength: 1
                profiles:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      total:
                        type: integer
                        format: int32
                      used:
                        type: integer
                        format: int32
                      available:
                        type: integer
                        format: int32
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
