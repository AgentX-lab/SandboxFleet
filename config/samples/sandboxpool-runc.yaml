# Sample Pool for runc Worker image (WORKER_RUNTIME=runc).
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: demo
  namespace: default
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: runc
  slotProfiles:
    - name: default
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
  workerTemplates:
    - name: mixed
      replicas: 1
      slots:
        - profile: default
          count: 2
