# Sample Pool for Kata Worker image (WORKER_RUNTIME=kata).
# Requires /dev/kvm on the node (see hack/ensure-kind-cluster.sh).
apiVersion: sandboxfleet.io/v1alpha1
kind: SandboxPool
metadata:
  name: demo
  namespace: default
spec:
  runtime:
    backend: cri
    cri:
      runtimeHandler: kata
      snapshotter: kata
      hostDevices:
        - /dev/kvm
  slotProfiles:
    - name: default
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
  workerTemplates:
    - name: mixed
      replicas: 1
      slots:
        - profile: default
          count: 2
