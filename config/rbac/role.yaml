apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandboxfleet-controller
rules:
  - apiGroups: ["sandboxfleet.io"]
    resources: ["sandboxpools", "sandboxes", "sandboxsnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sandboxfleet.io"]
    resources: ["sandboxpools/status", "sandboxes/status", "sandboxsnapshots/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["sandboxfleet.io"]
    resources: ["sandboxes/finalizers", "sandboxpools/finalizers", "sandboxsnapshots/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
